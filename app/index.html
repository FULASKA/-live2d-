<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live2D Stage</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "pixi.js": "/vendor8/pixi.js/dist/pixi.mjs",
  "untitled-pixi-live2d-engine/cubism": "/vendor8/untitled-pixi-live2d-engine/dist/cubism.es.js",
  "@pixi/sound": "/vendor8/@pixi/sound/lib/index.mjs"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <!-- 角色说的话 / DSH 当前在干什么，都走这个气泡 -->
  <div id="bubble" class="empty"></div>

  <!-- 窗口轮廓拖拽：无边框窗口自己画的八个把手（透明处也能抓） -->
  <div class="rz rz-n" data-edge="n"></div>
  <div class="rz rz-s" data-edge="s"></div>
  <div class="rz rz-w" data-edge="w"></div>
  <div class="rz rz-e" data-edge="e"></div>
  <div class="rz rz-nw" data-edge="nw"></div>
  <div class="rz rz-ne" data-edge="ne"></div>
  <div class="rz rz-sw" data-edge="sw"></div>
  <div class="rz rz-se" data-edge="se"></div>

  <div id="tools" class="hidden">
    <button class="tool" id="tool-settings" title="设置（独立窗口）">设置</button>
    <button class="tool" id="tool-quit" title="退出">退出</button>
  </div>

  <script src="./renderer.js" type="module"></script>
</body>
</html>
