<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live2D Stage</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "pixi.js": "/vendor8/pixi.js/dist/pixi.mjs",
  "untitled-pixi-live2d-engine/cubism": "/vendor8/untitled-pixi-live2d-engine/dist/cubism.es.js",
  "@pixi/sound": "/vendor8/@pixi/sound/lib/index.mjs"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <div id="tools" class="hidden">
    <button class="tool" id="tool-move" title="按住拖动窗口">✥</button>
    <button class="tool" id="tool-settings" title="设置">⚙</button>
    <button class="tool small" id="tool-hide" title="收起来">×</button>
  </div>

  <div id="panel" class="hidden">
    <header id="panel-head">
      <span class="grip" title="拖动窗口">✥ 设置</span>
      <span class="close" id="panel-close">×</span>
    </header>

    <section>
      <h3>窗口尺寸 A</h3>
      <div class="row">
        <input type="number" id="win-w" min="200" max="2400" step="10"> ×
        <input type="number" id="win-h" min="200" max="1600" step="10">
        <button id="win-apply">应用</button>
      </div>
      <div class="row"><button id="win-center">窗口居中</button></div>
    </section>

    <section>
      <h3>模型尺寸 B</h3>
      <div class="row"><input type="range" id="zoom" min="0.4" max="2.5" step="0.05"></div>
    </section>

    <section>
      <h3>跟随</h3>
      <div class="row"><label><input type="checkbox" id="gaze"> 眼 / 头 / 身体跟随鼠标</label></div>
      <div class="row"><input type="range" id="strength" min="0" max="1" step="0.05"></div>
    </section>

    <section>
      <h3>窗口行为</h3>
      <div class="row"><label><input type="checkbox" id="top"> 置顶</label></div>
      <div class="row"><label><input type="checkbox" id="click-through"> 穿透模式（鼠标穿过）</label></div>
      <div class="hint">穿透时按 <b>Ctrl+Alt+L</b> 找回；<b>Ctrl+Alt+Q</b> 退出</div>
    </section>

    <section class="footer">
      <button id="open-harness">验证台</button>
      <button id="quit">退出</button>
    </section>

    <div class="hint">拖动空白处移动窗口 · 右键打开/关闭设置 · 点/摸角色的分区有反应</div>
  </div>

  <script src="./renderer.js" type="module"></script>
</body>
</html>
