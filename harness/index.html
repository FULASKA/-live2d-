<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live2D Stage · 接口验证台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <h1>能力清单</h1>
    <div class="meta" id="meta">载入中…</div>
    <input id="q" placeholder="搜参数 / 动作 / 表情">
    <div class="sec"><h2>动作 <span id="n-motion"></span></h2><div id="motions" class="list"></div></div>
    <div class="sec"><h2>表情 <span id="n-exp"></span></h2><div id="expressions" class="list"></div></div>
    <div class="sec"><h2>参数 <span id="n-param"></span></h2><div id="params" class="list"></div></div>
  </aside>

  <main id="center">
    <div id="stage" class="checker"><canvas id="cv"></canvas></div>
    <div id="hud">
      <label><input type="checkbox" id="gaze" checked> 视线跟随</label>
      <label>强度 <input type="range" id="gaze-int" min="0" max="1" step="0.05" value="0.6"></label>
      <label><input type="checkbox" id="checker" checked> 透明格</label>
      <span class="spacer"></span>
      <span id="fps"></span>
    </div>
  </main>

  <aside id="right">
    <h1>动作总线</h1>
    <div class="row">
      <select id="state-sel">
        <option value="thinking">thinking</option><option value="working">working</option>
        <option value="waiting">waiting</option><option value="success">success</option><option value="error">error</option>
      </select>
      <button id="send-state">模拟状态回传</button>
    </div>
    <div class="sec"><h2>受控参数</h2><div id="held" class="list"></div></div>
    <div class="sec"><h2>事件日志</h2><div id="log" class="list log"></div></div>
  </aside>
</div>
<script src="./main.js" type="module"></script>
</body>
</html>
