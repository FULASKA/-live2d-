<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交叉验证 · pixi8 ESM</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #stage{position:absolute;inset:0}
  #err{position:absolute;left:12px;top:12px;color:#b00;font:13px/1.6 monospace;white-space:pre-wrap;max-width:70vw}
</style>
</head>
<body>
<div id="stage"></div>
<div id="err"></div>
<script src="/vendor/live2dcubismcore.min.js"></script>
<script>window.process = { env: { NODE_ENV: 'production' } }</script>
<script type="importmap">
{ "imports": { "pixi.js": "/tmp/alt/node_modules/pixi.js/dist/pixi.mjs" } }
</script>
<script type="module">
const err = (m) => { document.getElementById('err').textContent += m + '\n'; console.error(m) }
try {
  const PIXI = await import('pixi.js')
  const mod = await import('/tmp/alt/node_modules/@jannchie/pixi-live2d-display/dist/cubism4.es.js')
  const Live2DModel = mod.Live2DModel

  const app = new PIXI.Application()
  await app.init({ backgroundAlpha: 0, antialias: true, resizeTo: window, autoDensity: true })
  document.getElementById('stage').appendChild(app.canvas)

  const model = await Live2DModel.from('/m/%E5%A4%A7%E8%82%A5%E9%B1%BC.model3.json')
  model.anchor.set(0.5, 0.5)
  app.stage.addChild(model)

  const fit = () => {
    const w = app.renderer.width / app.renderer.resolution
    const h = app.renderer.height / app.renderer.resolution
    const s = Math.min(w / model.internalModel.originalWidth, h / model.internalModel.originalHeight) * 0.95
    model.scale.set(s)
    model.position.set(w / 2, h / 2)
  }
  fit()
  window.addEventListener('resize', fit)

  const q = new URLSearchParams(location.search)
  const steps = Number(q.get('steps') || 0)
  for (let i = 0; i < steps; i++) model.internalModel.update(1 / 60)
  app.renderer.render(app.stage)
  setInterval(() => { try { app.renderer.render(app.stage) } catch {} }, 120)
  document.title = `ALT ok tex=${(model.textures || []).length}`
} catch (e) {
  err('加载失败: ' + (e && e.message || e))
  document.title = 'ALT fail: ' + (e && e.message)
}
</script>
</body>
</html>
